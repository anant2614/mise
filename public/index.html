<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mise</title>
<meta name="description" content="Mise — an inbox agent that finds and prepares your pending work.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f6f5c">
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --ink: #1d1f1e; --muted: #6a6f6c; --line: #e3e1da;
    --accent: #1f6f5c; --accent-ink: #ffffff; --warn: #a3471f; --chip: #eef3f0;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141615; --panel: #1c1f1e; --ink: #e8ebe9; --muted: #9aa19d; --line: #2c312f; --accent: #5cc0a5; --accent-ink: #0d1412; --warn: #f08a5d; --chip: #23302b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  a { color: var(--accent); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  header .status { color: var(--muted); font-size: 13px; margin-left: auto; }
  main { max-width: 920px; margin: 0 auto; padding: 16px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; color: var(--muted); }
  .why { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  button.act { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--warn); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .banner { background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
  .warn { border-color: var(--warn); }
  label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 100%; max-width: 320px; }
  input[type=checkbox] { width: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 16px; }
  .landing { text-align: center; padding: 64px 16px; }
  .landing h2 { font-size: 28px; margin: 0 0 8px; }
  .landing p { color: var(--muted); max-width: 520px; margin: 0 auto 20px; }
  a.cta { display: inline-block; background: var(--accent); color: var(--accent-ink); padding: 10px 18px; border-radius: 9px; text-decoration: none; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; display: none; }
</style>
</head>
<body>
<header><h1>🤖 Mise</h1><span class="status" id="status"></span></header>
<main id="app"><div class="empty">Loading…</div></main>
<div class="toast" id="toast"></div>
<script>
const $app = document.getElementById("app");
const TABS = ["Approvals", "Tasks", "Waiting", "Activity", "Settings", "Learned"];
let tab = (() => { try { return localStorage.getItem("mise.tab") || "Approvals"; } catch { return "Approvals"; } })();
let data = null;

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => (t.style.display = "none"), 2500); }
const when = (ts) => (ts ? new Date(ts).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "");
const TYPE = { reply_needed: "Reply", schedule_meeting: "Schedule", follow_up: "Follow up", deadline: "Deadline", rsvp: "RSVP", review_doc: "Review", commitment: "You promised", pay_bill: "Bill" };

async function call(method, path, body) {
  const res = await fetch(path, { method, headers: { "content-type": "application/json", "x-mise": "1" }, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || out.ok === false) toast(out.reason || out.error || "Something went wrong");
  return out;
}

async function load() {
  const res = await fetch("/api/dashboard", { credentials: "same-origin" });
  if (res.status === 401) return renderLanding();
  data = await res.json();
  render();
}

function renderLanding() {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  $app.replaceChildren(h("div", { class: "landing" },
    h("h2", {}, "Your inbox, with the work already prepared."),
    h("p", {}, "Mise reads Gmail and Calendar, finds what you owe people, drafts replies in your voice, proposes meeting times, and waits for your OK before anything leaves your account."),
    h("a", { class: "cta", href: `/auth/google?tz=${encodeURIComponent(tz)}` }, "Connect Google"),
  ));
  document.getElementById("status").textContent = "";
}

function taskCard(t, opts = {}) {
  const pa = t.proposedAction;
  const actions = h("div", { class: "actions" });
  if (pa?.tool === "send_draft") actions.append(h("button", { class: "act primary", onclick: () => act(t, "approve") }, "Send draft"));
  if (pa?.tool === "respond_to_invite") {
    actions.append(h("button", { class: "act primary", onclick: () => act(t, "approve", { response: pa.args.response }) }, pa.args.response === "accepted" ? "Accept" : "Decline"));
    actions.append(h("button", { class: "act", onclick: () => act(t, "approve", { response: pa.args.response === "accepted" ? "declined" : "accepted" }) }, pa.args.response === "accepted" ? "Decline instead" : "Accept instead"));
  }
  if (!pa && t.status !== "done") actions.append(h("button", { class: "act", onclick: () => act(t, "done") }, "Done"));
  actions.append(h("button", { class: "act", onclick: () => act(t, "snooze", { until: Date.now() + 24 * 3600e3 }) }, "Snooze 1 day"));
  actions.append(h("button", { class: "act danger", onclick: () => act(t, "reject") }, pa ? "Reject" : "Dismiss"));
  const gmail = t.threadId && !t.threadId.startsWith("event:") ? h("a", { href: `https://mail.google.com/mail/u/0/#all/${t.threadId}`, target: "_blank", rel: "noopener" }, "Open in Gmail") : null;
  return h("div", { class: "card" },
    h("div", { class: "row" }, h("span", { class: "chip" }, TYPE[t.type] || t.type), h("strong", {}, t.ask), t.counterparty ? h("span", { class: "chip" }, t.counterparty) : null, t.dueAt ? h("span", { class: "chip" }, `due ${when(t.dueAt)}`) : null),
    t.rationale ? h("div", { class: "why" }, "Why: ", t.rationale) : null,
    opts.readOnly ? null : actions,
    gmail ? h("div", { class: "why" }, gmail) : null,
  );
}

async function act(t, verb, body = {}) {
  await call("POST", `/api/tasks/${t.id}/${verb}`, body);
  await load();
}

function list(items, empty, fn) { return items.length ? items.map(fn) : [h("div", { class: "empty" }, empty)]; }

function render() {
  const open = data.tasks.filter((t) => ["detected", "planned", "awaiting_approval"].includes(t.status));
  const approvals = open.filter((t) => t.status === "awaiting_approval");
  const mine = open.filter((t) => t.owner === "user" && t.status !== "awaiting_approval");
  const waiting = open.filter((t) => t.owner === "them" && t.status !== "awaiting_approval");
  document.getElementById("status").textContent = `${data.settings?.email ?? ""} · ${approvals.length} awaiting approval`;

  const nav = h("nav", {}, TABS.map((name) => h("button", { "aria-selected": String(tab === name), onclick: () => { tab = name; try { localStorage.setItem("mise.tab", name); } catch {} render(); } }, name)));
  const banners = [];
  if (data.needsReauth) banners.push(h("div", { class: "banner warn" }, "Google access expired. ", h("a", { href: "/auth/google" }, "Reconnect")));
  for (const key of data.promotionOffers) banners.push(h("div", { class: "banner" }, `You've approved every "${key}" lately without edits. `,
    h("button", { class: "act primary", onclick: async () => { await call("PUT", "/api/settings", { autonomy: { [key]: true } }); await load(); } }, "Let Mise do it automatically")));
  if (new URLSearchParams(location.search).has("welcome")) banners.push(h("div", { class: "banner" }, "Connected. Mise is reading the last 30 days; your first brief will arrive by email shortly."));

  let body;
  if (tab === "Approvals") body = list(approvals, "Nothing waiting for your OK.", (t) => taskCard(t));
  if (tab === "Tasks") body = [...list(mine, "No open tasks.", (t) => taskCard(t)), data.fyi.length ? h("h3", {}, "FYI") : null, ...data.fyi.map((f) => h("div", { class: "card" }, f.summary, h("div", { class: "why" }, f.reason)))];
  if (tab === "Waiting") body = list(waiting, "You're not waiting on anyone.", (t) => taskCard(t));
  if (tab === "Activity") body = [h("div", { class: "card" }, h("table", {},
    h("tr", {}, h("th", {}, "When"), h("th", {}, "Action"), h("th", {}, "Why"), h("th", {}, "")),
    data.actions.map((a) => h("tr", {},
      h("td", {}, when(a.createdAt)),
      h("td", {}, a.tool, " ", h("span", { class: "chip" }, a.tier), " ", h("span", { class: "chip" }, a.status === "executed" ? (a.approvedBy === "user" ? "approved by you" : "automatic") : a.status)),
      h("td", {}, a.rationale || ""),
      h("td", {}, a.status === "executed" && ["apply_label", "archive_thread", "create_draft", "create_event"].includes(a.tool)
        ? h("button", { class: "act", onclick: async () => { await call("POST", `/api/actions/${a.id}/undo`); await load(); } }, "Undo") : ""),
    )),
  ))];
  if (tab === "Settings") body = [settingsForm()];
  if (tab === "Learned") body = [learned()];
  $app.replaceChildren(nav, ...banners, ...body);
}

function settingsForm() {
  const s = data.settings;
  const f = h("form", { class: "card", onsubmit: async (e) => {
    e.preventDefault();
    const v = (id) => f.querySelector(`#${id}`);
    await call("PUT", "/api/settings", {
      timezone: v("tz").value, briefTime: v("brief").value, followUpBusinessDays: Number(v("fu").value),
      autoArchiveNewsletters: v("arch").checked,
      workingHours: { start: v("ws").value, end: v("we").value, days: s.workingHours.days },
      meetings: { durationMinutes: Number(v("dur").value), earliest: v("earliest").value, bufferMinutes: Number(v("buf").value), createHolds: v("holds").checked },
      vips: v("vips").value.split(/[\s,]+/).filter(Boolean),
      autonomy: Object.fromEntries([...f.querySelectorAll("[data-auto]")].map((c) => [c.dataset.auto, c.checked])),
    });
    toast("Saved"); await load();
  } });
  const auto = ["send_draft:reply_needed", "send_draft:schedule_meeting", "send_draft:follow_up", "respond_to_invite:rsvp"];
  f.append(
    h("div", { class: "grid" },
      h("div", {}, h("label", { for: "tz" }, "Timezone"), h("input", { id: "tz", value: s.timezone })),
      h("div", {}, h("label", { for: "brief" }, "Morning brief at"), h("input", { id: "brief", type: "time", value: s.briefTime })),
      h("div", {}, h("label", { for: "ws" }, "Working hours start"), h("input", { id: "ws", type: "time", value: s.workingHours.start })),
      h("div", {}, h("label", { for: "we" }, "Working hours end"), h("input", { id: "we", type: "time", value: s.workingHours.end })),
      h("div", {}, h("label", { for: "earliest" }, "No meetings before"), h("input", { id: "earliest", type: "time", value: s.meetings.earliest })),
      h("div", {}, h("label", { for: "dur" }, "Default meeting length (min)"), h("input", { id: "dur", type: "number", min: 10, max: 240, value: s.meetings.durationMinutes })),
      h("div", {}, h("label", { for: "buf" }, "Buffer between meetings (min)"), h("input", { id: "buf", type: "number", min: 0, max: 120, value: s.meetings.bufferMinutes })),
      h("div", {}, h("label", { for: "fu" }, "Nudge after (business days)"), h("input", { id: "fu", type: "number", min: 1, max: 30, value: s.followUpBusinessDays })),
    ),
    h("label", { for: "vips" }, "VIP contacts (comma-separated)"), h("input", { id: "vips", value: s.vips.join(", "), style: "max-width:100%" }),
    h("label", {}, h("input", { id: "holds", type: "checkbox", checked: s.meetings.createHolds }), " Create tentative calendar holds for proposed slots"),
    h("label", {}, h("input", { id: "arch", type: "checkbox", checked: s.autoArchiveNewsletters }), " Auto-archive newsletters"),
    h("h3", {}, "Autonomy"),
    h("div", { class: "why" }, "Outward actions need your approval unless you turn them on here. Mail flagged suspicious always needs you. Forwarding, deleting mail and payments are never allowed."),
    ...auto.map((k) => h("label", {}, h("input", { type: "checkbox", "data-auto": k, checked: !!s.autonomy[k] }), ` ${k}`)),
    h("div", { class: "actions" },
      h("button", { class: "act primary", type: "submit" }, "Save"),
      h("button", { class: "act", type: "button", onclick: async () => { await call("POST", "/api/brief"); toast("Brief sent to your inbox"); } }, "Send brief now"),
      h("button", { class: "act danger", type: "button", onclick: async () => { if (confirm("Disconnect Google and delete everything Mise stored?")) { await call("POST", "/api/disconnect"); location.href = "/"; } } }, "Disconnect & delete data"),
    ),
  );
  return f;
}

function learned() {
  const box = h("div", {});
  box.append(h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "What Mise has learned about you"),
    ...list(data.preferences, "Nothing yet. Mise learns from how you edit its drafts.", (p) => h("div", { class: "row" },
      h("span", {}, p.value), h("span", { class: "chip" }, p.source),
      h("button", { class: "act danger", onclick: async () => { await call("DELETE", `/api/preferences/${encodeURIComponent(p.key)}`); await load(); } }, "Forget"))),
    h("form", { class: "row", style: "margin-top:10px", onsubmit: async (e) => { e.preventDefault(); const i = e.target.querySelector("input"); if (!i.value.trim()) return; await call("PUT", `/api/preferences/style.user.${Date.now()}`, { value: i.value.trim() }); await load(); } },
      h("input", { placeholder: "Add a rule, e.g. Sign off with 'A.'" }), h("button", { class: "act", type: "submit" }, "Add")),
  ));
  box.append(h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "How your drafts are doing"),
    ...list(data.outcomes, "No outcomes yet.", (o) => h("div", { class: "row" }, h("span", { class: "chip" }, o.actionType), `${o.signal}: ${o.n}`, o.avgEdit != null ? h("span", { class: "why" }, `avg edit ${(o.avgEdit * 100).toFixed(0)}%`) : null)),
  ));
  return box;
}

load();
setInterval(() => { if (document.visibilityState === "visible" && data) load(); }, 20000);
</script>
</body>
</html>
